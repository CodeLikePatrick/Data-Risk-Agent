[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ecom-risk-agent"
version = "0.2.0"
description = "E-commerce risk detection engine and LLM review agent"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Deng Peng" }]
keywords = ["e-commerce", "risk-control", "fraud-detection", "llm-agent", "rag"]
dependencies = ["numpy", "pandas"]

[project.optional-dependencies]
dev = ["pytest", "scikit-learn"]
models = ["lightgbm"]
viz = ["matplotlib"]

[tool.setuptools]
packages = ["ecomrisk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
